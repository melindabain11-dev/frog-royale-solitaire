<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frog Royale Solitaire 🐸👑</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(#0a2f1f, #1a4735);
            color: #fff;
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.4);
        }
        .game {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            padding: 10px;
        }
        .piles {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .foundation, .stock-area {
            width: 80px;
            height: 110px;
            border: 2px solid #ffd700;
            border-radius: 8px;
            background: rgba(255,215,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .tableau {
            display: flex;
            gap: 8px;
        }
        .column {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .card {
            width: 80px;
            height: 110px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            position: absolute;
            cursor: grab;
            user-select: none;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            padding: 8px 16px;
            margin: 0 5px;
            background: #228b22;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>Frog Royale Solitaire 🐸👑</h1>
    </header>
    <div class="game">
        <div class="piles">
            <div id="stock" class="stock-area" onclick="drawCard()">Stock</div>
            <div id="waste" class="stock-area"></div>
            <div style="width: 60px;"></div>
            <div id="foundations" class="piles"></div>
        </div>
        
        <div class="tableau" id="tableau"></div>
        
        <div class="controls">
            <button onclick="newDeal()">New Deal</button>
            <button onclick="showHelp()">How to Play</button>
        </div>
    </div>

    <script>
        const suits = ['s', 'h', 'd', 'c'];
        const ranks = ['a','2','3','4','5','6','7','8','9','10','j','q','k'];
        
        let deck = [];
        let tableau = Array(7).fill().map(() => []);
        let foundations = Array(4).fill().map(() => []);
        let waste = [];
        
        function createDeck() {
            deck = [];
            for (let suit of suits) {
                for (let rank of ranks) {
                    deck.push(`${rank}${suit}`);
                }
            }
            // Shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }
        
        function deal() {
            createDeck();
            tableau = Array(7).fill().map(() => []);
            foundations = Array(4).fill().map(() => []);
            waste = [];
            
            let idx = 0;
            for (let col = 0; col < 7; col++) {
                for (let row = col; row < 7; row++) {
                    tableau[row].push(deck[idx++]);
                }
            }
            render();
        }
        
        function getCardImage(card) {
            return `images/${card}.png`;
        }
        
        function render() {
            // Render tableau
            const tableauEl = document.getElementById('tableau');
            tableauEl.innerHTML = '';
            
            for (let col = 0; col < 7; col++) {
                const colEl = document.createElement('div');
                colEl.className = 'column';
                tableau[col].forEach((card, i) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card';
                    cardEl.style.top = `${i * 25}px`;
                    cardEl.innerHTML = `<img src="${getCardImage(card)}" alt="${card}">`;
                    cardEl.draggable = true;
                    cardEl.dataset.card = card;
                    cardEl.dataset.col = col;
                    cardEl.dataset.index = i;
                    // Add drag events...
                    colEl.appendChild(cardEl);
                });
                tableauEl.appendChild(colEl);
            }
            
            // Simple foundations and waste rendering (expandable)
            console.log("Game rendered with your frog cards!");
        }
        
        function newDeal() {
            deal();
        }
        
        function showHelp() {
            alert("Frog Royale Solitaire Rules:\n\n- Build descending alternating colors on tableau\n- Move Kings to empty columns\n- Build Ace to King in suit on foundations\n- Click Stock to draw cards\n\nOur frogs are waiting for you to win their kingdom! 🐸❤️");
        }
        
        // Initial deal
        window.onload = () => {
            deal();
        };
    </script>
</body>
</html>
    </script>
</body>
</html>
